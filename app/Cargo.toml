[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
rp235x-hal = { version = "0.4", features = ["rt", "binary-info"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
embedded-hal = "1"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
